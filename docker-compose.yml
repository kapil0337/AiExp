services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloom
      POSTGRES_PASSWORD: bloom
      POSTGRES_DB: bloom
    volumes:
      - bloom_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloom -d bloom"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bloom:bloom@db:5432/bloom
      APP_NAME: ${APP_NAME:-Bloom Budget}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # 3.3-70b hangs without ever responding; 8b answers in ~1s. See README.
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Compose serves plain HTTP. A Secure cookie is dropped by the browser
      # over http:// on anything but localhost, which silently breaks login
      # when you open the app from a phone at http://<your-lan-ip>:8000.
      # Keep this false for local Docker; it stays true (the default) on Vercel.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "8000:8000"

volumes:
  bloom_pgdata:
